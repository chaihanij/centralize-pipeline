# ==========================================================
# Commitizen Configuration (.cz.toml)
# DevSecOps Pipeline
# Year-based Semantic Versioning: YY.MINOR.PATCH
# Example: 26.1.0 (Year 2026)
# ==========================================================

[tool.commitizen]
name = "cz_conventional_commits"
version_scheme = "semver"
version_provider = "commitizen"

# ----------------------------------------------------------
# Version (SOURCE OF TRUTH)
# ----------------------------------------------------------
# IMPORTANT:
# - Do NOT manage version in Makefile or package.json
# - Read via: cz version
version = "26.2.0"

# ----------------------------------------------------------
# Tagging
# ----------------------------------------------------------
# Tags are used for version tracking but creation is controlled by CI
tag_format = "v$version"
annotated_tag = true
gpg_sign = false

# ----------------------------------------------------------
# Version Files (DISABLED)
# ----------------------------------------------------------
# Makefile must NOT be modified by Commitizen
version_files = []

# ----------------------------------------------------------
# Changelog
# ----------------------------------------------------------
update_changelog_on_bump = false
changelog_file = "CHANGELOG.md"
changelog_incremental = true

# ----------------------------------------------------------
# Commit Message
# ----------------------------------------------------------
bump_message = "chore(release): bump version $current_version → $new_version"

message_length_limit = 100

allowed_prefixes = [
    "Merge",
    "Revert",
    "Pull request",
    "fixup!",
    "squash!"
]

# Enable BREAKING CHANGE via "!"
breaking_change_exclamation_in_title = true

# ----------------------------------------------------------
# Hooks (DISABLED)
# ----------------------------------------------------------
# All git push / tag operations must be controlled by CI
pre_bump_hooks = []
post_bump_hooks = []

# ----------------------------------------------------------
# UI / UX (Optional)
# ----------------------------------------------------------
use_shortcuts = true